[project]
name = "project-status-checker"
dynamic = ["version"]
requires-python = "~=3.15.0"
dependencies = ["mdutils==1.8.1", "requests==2.34.2", "structlog==26.1.0"]

[project.optional-dependencies]
dev = [
  "pytest-cov==7.1.0",
  "pytest==9.1.1",
  "ruff==0.17.2",
  "ty==0.0.91",
  "vulture==2.16",
]
test = ["Markdown==3.11.2", "beautifulsoup4==4.15.0"]

[tool.uv]
required-version = "~=0.13.0"
package = false

[tool.setuptools]
py-modules = ["checker", "tests"]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
extend-select = ["E501"]
select = ["ALL"]

ignore = [
  "CPY001", # Copyright is maintained in LICENCE
  "COM812",  # Ignore due to conflict with Ruff formatter
  "ISC001",  # Ignore due to conflict with Ruff formatter
  "PLR2004", # Ignore magic value
  "D104",    # Ignore missing docstring in public package
  "D100",    # Ignore missing docstring in public module
  "N999",    # Ignore invalid module name
  "SIM112",  # Ignore Lowercase environment variables (used for GitHub actions)
  "FBT001",  # Ignore Boolean-typed positional argument in function definition
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"**test_*.py" = ["S101", "D102", "D103", "SLF001", "PT019", "PLR0913", "PLR0917"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["checker"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = []
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.vulture]
ignore_names = ["side_effect"]
exclude = ["*/plugins/*", ".venv"]
